<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Le Refuge — Carnet interactif</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:#4e345b;color:#60324f;font-family:Georgia,serif}[hidden]{display:none!important}
.viewport{width:100%;overflow-x:auto;background:#4e345b}.scene{position:relative;width:100%;min-width:1050px;aspect-ratio:1648/928;background:url('decor-palia.webp') center center/100% 100% no-repeat}
button,input,textarea{font-family:Georgia,serif}button{cursor:pointer}.overlay{position:absolute;z-index:2}
.nav{left:1.4%;top:33%;width:16.4%;display:grid;gap:1.2vw}.nav button{height:clamp(47px,5.15vw,87px);border:0;border-radius:8px;color:#fff2df;font-size:clamp(15px,1.4vw,24px);font-weight:bold;text-align:left;padding-left:17%;text-shadow:0 2px 3px #472b38;background:linear-gradient(130deg,#89536eeb,#663e58ef);box-shadow:inset 0 0 0 2px #cfa27b,0 3px 6px #34242a80}.nav button[aria-current=page]{background:linear-gradient(130deg,#a457a0f2,#6b3d77f2)}
.account{left:66%;top:18.6%;width:29%;display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}.account button{background:#814e89;color:white;border:2px solid #e7b7b4;border-radius:10px;padding:7px 11px;font-size:clamp(12px,.95vw,16px)}#profil{background:#fff1dbe8;border-radius:8px;padding:5px;font-size:clamp(12px,.95vw,16px)}
#message{position:absolute;top:23%;left:62%;width:33%;z-index:3;margin:0;text-align:right;color:#6b2e65;font-size:clamp(12px,.9vw,15px);background:#fff3e0cf;border-radius:6px}#message:empty{display:none}
.book-area{position:absolute;left:22.8%;top:38%;width:65.5%;height:46%;display:grid;grid-template-columns:48% 48%;column-gap:4%;z-index:2;pointer-events:none}.book-area>*{pointer-events:auto;min-width:0}
.paper{background:linear-gradient(100deg,#fff0dcd9,#ffe9d6e5);border:1px solid #c58b91b0;border-radius:10px;box-shadow:0 2px 10px #7c56642b;padding:clamp(9px,1vw,18px);overflow:auto;scrollbar-color:#c998ad transparent}
.paper h2{font-size:clamp(16px,1.35vw,23px);margin:0 0 9px;color:#6c3d65}.event{background:#fff7e8d9;border:1px solid #d6a6a8;border-radius:10px;padding:9px;margin:7px 0;font-size:clamp(12px,.91vw,15px)}.event h3{font-size:clamp(14px,1.1vw,18px);margin:0 0 5px}.event p{margin:4px 0}.muted{color:#79596b;font-size:12px}.registration{border-top:1px dashed #bd99a9;margin-top:8px;padding-top:6px}.inline{display:flex;gap:4px;flex-wrap:wrap;align-items:center}.inline input{flex:1;min-width:100px}.inline button{flex:0 0 auto}
label{display:block;font-weight:bold;font-size:clamp(12px,.9vw,15px);margin:5px 0 2px}input,textarea{display:block;width:100%;padding:5px 8px;border:1px solid #d6a1ad;border-radius:8px;background:#fff9f0ed;color:#5b3e52;font-size:clamp(12px,.95vw,16px)}textarea{resize:vertical;min-height:40px;height:48px}.paper button{border:1px solid #8d5b87;border-radius:8px;background:linear-gradient(#aa6cab,#7c468e);color:white;padding:6px 9px;font-size:clamp(11px,.85vw,14px);margin:4px 2px}.paper button.danger{background:#a44d6d}.paper button:disabled{opacity:.55}#form-message{font-size:12px;margin:3px 0}#formulaire-evenement{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}#formulaire-evenement .full{grid-column:1/-1}#formulaire-evenement .actions{display:flex;flex-wrap:wrap;justify-content:center}.footer{font-size:12px;text-align:center;color:#fff4e4;padding:9px}
@media(max-width:1050px){.scene{width:1050px}.nav{gap:9px}.nav button{height:52px}.book-area{top:38%;height:46%}}
</style></head><body><div class="viewport" aria-label="Décor illustré du Refuge, défilement horizontal possible sur petit écran"><div class="scene">
<nav class="overlay nav" aria-label="Navigation du Refuge"><button type="button" id="nav-evenements" aria-current="page">▦ &nbsp; Événements</button><button type="button" id="nav-mes-evenements">♙ &nbsp; Mes événements</button><button type="button" id="nav-aide">? &nbsp; Aide</button></nav>
<div class="overlay account" id="account"><button id="connexion">Se connecter avec Discord</button><span id="profil"></span><button id="deconnexion" hidden>Se déconnecter</button></div><p id="message" role="status"></p>
<main id="espace-evenements" class="book-area" hidden>
<section class="paper"><h2>📅 Les prochains événements</h2><div id="liste-evenements" aria-live="polite"></div></section>
<section class="paper"><h2 id="form-title">🪶 Créer un événement</h2><form id="formulaire-evenement">
<div class="full"><label for="titre-evenement">Titre de l'événement *</label><input id="titre-evenement" required maxlength="120" placeholder="Ex. : Soirée récolte à Kilima"></div>
<div><label for="date-evenement">Date et heure *</label><input id="date-evenement" type="datetime-local" required></div>
<div><label for="lieu-evenement">Lieu</label><input id="lieu-evenement" maxlength="200" placeholder="Ex. : Kilima"></div>
<div class="full"><label for="description-evenement">Description</label><textarea id="description-evenement" maxlength="3000" placeholder="Décris ton événement…"></textarea></div>
<div class="full actions"><button type="submit" id="save-event">🌸 Créer l'événement</button><button type="button" id="cancel-edit" class="subtle" hidden>Annuler la modification</button></div></form><p id="form-message" role="status"></p></section>
</main></div></div><footer class="footer">✿ Le Refuge — De jolis moments à partager ✿</footer><script>const SUPABASE_URL="https://kflrkclmznluxahxttgl.supabase.co";
const SUPABASE_KEY="sb_publishable_jlnA8997jDcKMdJYzyw--A_7csvsml3";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let currentUser=null,events=[],editingId=null;
const say=(s)=>{$("message").textContent=s};
const formatDate=d=>new Date(d).toLocaleString("fr-FR",{dateStyle:"full",timeStyle:"short"});
function line(parent,content,cls){const p=document.createElement("p");p.textContent=content;if(cls)p.className=cls;parent.append(p);return p}
function btn(label,fn,cls="small"){const b=document.createElement("button");b.type="button";b.textContent=label;b.className=cls;b.addEventListener("click",fn);return b}
function resetForm(){editingId=null;$("formulaire-evenement").reset();$("form-title").textContent="🪶 Créer un événement";$("save-event").textContent="🌸 Créer l'événement";$("cancel-edit").hidden=true;$("form-message").textContent=""}
function editEvent(e){editingId=e.id;$("titre-evenement").value=e.titre;$("description-evenement").value=e.description||"";const dt=new Date(e.date_evenement);const local=new Date(dt.getTime()-dt.getTimezoneOffset()*60000).toISOString().slice(0,16);$("date-evenement").value=local;$("lieu-evenement").value=e.lieu||"";$("form-title").textContent="🪶 Modifier l'événement";$("save-event").textContent="Enregistrer les modifications";$("cancel-edit").hidden=false;$("formulaire-evenement").scrollIntoView({behavior:"smooth",block:"center"})}
async function deleteEvent(e){if(!confirm("Supprimer définitivement « "+e.titre+" » ?"))return;const {error}=await sb.from("evenements").delete().eq("id",e.id);if(error){say("Suppression impossible : "+error.message);return}say("Événement supprimé.");await loadEvents()}
async function signUp(e,poste){const {error}=await sb.from("inscriptions").insert({evenement_id:e.id,membre_id:currentUser.id,poste});if(error){say(error.code==="23505"?"Tu es déjà inscrit(e) à ce poste.":"Inscription impossible : "+error.message);return}say("Inscription enregistrée ! 🌸");await loadEvents()}
async function cancelSignUp(reg){const {error}=await sb.from("inscriptions").delete().eq("id",reg.id).eq("membre_id",currentUser.id);if(error){say("Annulation impossible : "+error.message);return}say("Inscription annulée.");await loadEvents()}
async function loadEvents(){
 const list=$("liste-evenements");list.textContent="Chargement des événements…";
 const [{data,error},{data:regs,error:regError}]=await Promise.all([
  sb.from("evenements").select("id,titre,description,date_evenement,lieu,createur_id,createur_pseudo").order("date_evenement",{ascending:true}),
  sb.from("inscriptions").select("id,evenement_id,membre_id,poste")
 ]);
 if(error){list.textContent="Impossible de charger les événements : "+error.message;return}
 events=(data||[]).filter(e=>!ownOnly||e.createur_id===currentUser.id);list.replaceChildren();if(!events.length){line(list,"Aucun événement pour le moment. 🌸");return}
 if(regError)line(list,"Les inscriptions ne peuvent pas être affichées pour le moment.","muted");
 for(const e of events){
  const card=document.createElement("article");card.className="event";const h=document.createElement("h3");h.textContent="✿ "+e.titre;card.append(h);
  line(card,"📅 "+formatDate(e.date_evenement));line(card,"📍 "+(e.lieu||"Lieu non précisé"));
  if(e.description)line(card,e.description);
  line(card,"🌸 Organisé par "+(e.createur_pseudo||"Membre du Refuge"),"muted");
  if(e.createur_id===currentUser.id){card.append(btn("✏️ Modifier",()=>editEvent(e)),btn("🗑️ Supprimer",()=>deleteEvent(e),"small danger"))}
  const box=document.createElement("div");box.className="registration";const title=document.createElement("strong");title.textContent="Participations";box.append(title);
  const these=(regs||[]).filter(r=>r.evenement_id===e.id);
  if(these.length){const counts={};for(const r of these)counts[r.poste]=(counts[r.poste]||0)+1;line(box,Object.entries(counts).map(([p,n])=>p+" ("+n+")").join(" · "),"muted")}
  else line(box,"Pas encore d'inscription.","muted");
  const own=these.filter(r=>r.membre_id===currentUser.id);
  for(const r of own){const row=document.createElement("div");row.className="inline";line(row,"Ton poste : "+r.poste,"muted");row.append(btn("Annuler",()=>cancelSignUp(r),"small danger"));box.append(row)}
  const form=document.createElement("form");form.className="inline";const input=document.createElement("input");input.required=true;input.maxLength=80;input.placeholder="Ton poste / rôle";input.setAttribute("aria-label","Poste ou rôle pour "+e.titre);
  const submit=document.createElement("button");submit.type="submit";submit.textContent="🌷 M'inscrire";submit.className="small";form.append(input,submit);
  form.addEventListener("submit",async ev=>{ev.preventDefault();const poste=input.value.trim();if(poste)await signUp(e,poste)});box.append(form);card.append(box);list.append(card);
 }
}
async function refresh(){
 const {data:{session},error}=await sb.auth.getSession();
 if(error){say("Erreur de connexion : "+error.message);return}
 currentUser=session?.user||null;$("connexion").hidden=!!currentUser;$("deconnexion").hidden=!currentUser;$("espace-evenements").hidden=!currentUser;
 if(!currentUser){$("profil").textContent="";resetForm();return}
 const m=currentUser.user_metadata||{};const pseudo=m.custom_claims?.global_name||m.full_name||m.name||m.user_name||"Membre du Refuge";
 $("profil").textContent="Bienvenue "+pseudo+" ! 🌸";await loadEvents();
}
$("connexion").addEventListener("click",async()=>{say("Connexion en cours…");const {error}=await sb.auth.signInWithOAuth({provider:"discord",options:{redirectTo:"https://naethalia.github.io/le-refuge/"}});if(error)say("Connexion impossible : "+error.message)});
$("deconnexion").addEventListener("click",async()=>{const {error}=await sb.auth.signOut();if(error){say("Déconnexion impossible : "+error.message);return}say("Tu es déconnecté(e).");await refresh()});
$("cancel-edit").addEventListener("click",resetForm);
$("formulaire-evenement").addEventListener("submit",async ev=>{
 ev.preventDefault();if(!currentUser)return;
 const payload={titre:$("titre-evenement").value.trim(),description:$("description-evenement").value.trim(),date_evenement:new Date($("date-evenement").value).toISOString(),lieu:$("lieu-evenement").value.trim()};
 if(!payload.titre)return;
 $("save-event").disabled=true;
 let result;
 if(editingId!==null)result=await sb.from("evenements").update(payload).eq("id",editingId);
 else result=await sb.from("evenements").insert({...payload,createur_id:currentUser.id});
 $("save-event").disabled=false;
 if(result.error){$("form-message").textContent="Erreur : "+result.error.message;return}
 say(editingId===null?"Ton événement a bien été créé ! 🌸":"Événement modifié ! 🌸");resetForm();await loadEvents();
});
let ownOnly=false;
$("nav-evenements").addEventListener("click",async()=>{ownOnly=false;$("nav-evenements").setAttribute("aria-current","page");$("nav-mes-evenements").removeAttribute("aria-current");if(currentUser)await loadEvents();$("espace-evenements").scrollIntoView({behavior:"smooth"})});
$("nav-mes-evenements").addEventListener("click",async()=>{ownOnly=true;$("nav-mes-evenements").setAttribute("aria-current","page");$("nav-evenements").removeAttribute("aria-current");if(currentUser)await loadEvents();$("espace-evenements").scrollIntoView({behavior:"smooth"})});
$("nav-aide").addEventListener("click",()=>alert("Connecte-toi avec Discord, puis crée un événement dans le carnet. Pour participer à un événement, indique ton poste ou ton rôle et clique sur M'inscrire."));
refresh();
</script></body></html>
